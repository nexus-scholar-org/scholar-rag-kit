[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scholar-rag-kit"
version = "0.1.0"
description = "Scientific retrieval-augmented generation, structural chunking, and graph-boosted synthesis kit."
authors = [{ name = "Nexus Scholar Org" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "chromadb>=0.4.22",
    "sentence-transformers>=2.3.1",
    "openai>=1.12.0",
    "networkx>=3.0",
    "pydantic>=2.0.0",
    "bibtexparser>=2.0.0b7",
    # Sibling Nexus Scholar kits are declared as PEP 508 direct git references
    # pinned to canonical main SHAs. None of them is published on PyPI, so a
    # bare name cannot be resolved from the public index by a standalone
    # `uv pip install scholar_rag`. The direct reference is the standalone
    # carrier and carries the requirement into the wheel METADATA as
    # `git+https://...@<sha>`.
    #
    # scholar-protocol-kit is required by scholar_rag/matrix.py, which imports
    # it at module level. It was previously reachable only through the relative
    # editable tool.uv.sources entry and was NOT declared in
    # [project.dependencies] (E3/T-110 import inventory).
    "scholar-protocol-kit @ git+https://github.com/nexus-scholar-org/scholar-protocol-kit@4e10f25c25a1b150ce518348d211c7771683a9b7",
    "scholar-graph-kit @ git+https://github.com/nexus-scholar-org/scholar-graph-kit@4f0f4382ad4c940b2a3da838a12f1b47affd2b31",
    "scholar-bib-kit @ git+https://github.com/nexus-scholar-org/scholar-bib-kit@0bf3cdd2d0ace6dc626f033871747a78681c6ddf",
    "scholar-search-kit @ git+https://github.com/nexus-scholar-org/scholar-search-kit@911d864fcb6a706d4c0339f80524a46f591e2cad",
]

# Heavy third-party backends stay REQUIRED on purpose. chromadb is imported only
# lazily (indexer.py, retriever.py, index_verifier.py, replacement.py,
# recovery.py, embedder.py each carry an explicit "deferred: keeps this module
# import chromadb-free" guard), and google-generativeai / numpy / httpx / yaml
# are likewise lazy or guarded. They are nonetheless kept required because
# demoting a runtime backend is a contract-behaviour change, not a packaging
# change: the E3/T-110 charter allows demotion only where the authoritative path
# already fails with a typed missing-capability response, and that response is
# T-90 domain behaviour outside this packet's allowed surface. Keeping them
# required is the option that cannot alter runtime semantics.

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
scholar-rag = "scholar_rag.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/scholar_rag"]

# hatchling refuses PEP 508 direct references unless this is set. It is required
# here because no sibling kit is on PyPI, so the only installable standalone
# declaration is a git direct reference. (scholar-pdf-kit already uses the same
# opt-in.) Note this makes the wheel intentionally non-uploadable to PyPI, which
# is correct: these kits are installed from their canonical git repositories.
[tool.hatch.metadata]
allow-direct-references = true

# E3/T-110: the four relative editable sibling sources that used to live here
# (../scholar-protocol-kit, ../scholar-graph-kit, ../scholar-bib-kit,
# ../scholar-search-kit) were removed. They only resolved inside the harness
# monorepo or beside a sibling checkout on disk, so they made the built wheel
# uninstallable anywhere else. The git+https direct references in
# [project.dependencies] are now the single standalone carrier.

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]